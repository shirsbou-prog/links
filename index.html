<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shir's Boutique | קונדיטוריה בוטיק</title>
<meta name="description" content="כל הקישורים של Shir's Boutique במקום אחד">
<meta property="og:title" content="Shir's Boutique | קונדיטוריה בוטיק">
<meta property="og:description" content="כל הקישורים במקום אחד">
<meta property="og:image" content="logo.png">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--pink:#FFD6E0;--black:#000;--white:#fff;--gold:#D4AF37}
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--pink)}
  body{
    min-height:100vh;font-family:Heebo,Arial,sans-serif;color:var(--black);text-align:center;
    background:
      radial-gradient(circle at 15% 8%,rgba(212,175,55,.18),transparent 40%),
      radial-gradient(circle at 90% 85%,rgba(255,255,255,.7),transparent 45%),
      var(--pink);
    padding:28px 16px 40px;
  }
  /* רקע חגיגי לתקופת חנוכה, קבוע מאחורי הדף. מופעל מהסקריפט עד התאריך ב-BG_UNTIL */
  .bg{position:fixed;inset:0;z-index:-1;display:none;background:url(bg_tall.jpg) center/cover no-repeat}
  .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,214,224,.35),rgba(255,214,224,.15) 40%,rgba(255,214,224,.3))}
  @media (min-width:700px){.bg{background-image:url(bg_wide.jpg)}}
  body.holiday{background:transparent}
  .group{display:none;margin:26px 0 0;padding:22px 18px 20px;border-radius:20px;background:rgba(255,255,255,.88);border:1.5px solid var(--gold);box-shadow:0 8px 24px rgba(90,52,24,.12)}
  .group.on{display:block}
  .group h2{font-weight:800;font-size:20px;margin-bottom:6px}
  .group p{font-weight:500;font-size:15px;line-height:1.5;margin-bottom:14px}
  .group .btn,body.holiday .group .btn{margin:0;background:var(--black);color:var(--white);box-shadow:0 3px 0 var(--gold)}
  body.holiday .bg{display:block}
  body.holiday .btn{background:rgba(255,255,255,.92)}
  body.holiday .btn.hl{background:var(--black)}
  body.holiday .tagline,body.holiday footer{text-shadow:0 1px 8px rgba(255,255,255,.9)}
  main{max-width:440px;margin:0 auto;position:relative}
  .logo{width:230px;max-width:70%;height:auto;display:block;margin:0 auto 14px}
  .tagline{font-weight:700;font-size:17px;margin-bottom:26px}
  .sec{display:flex;align-items:center;gap:12px;font-weight:800;font-size:15px;color:#7a5f12;margin:22px 4px 10px}
  .sec::before,.sec::after{content:"";flex:1;height:1px;background:var(--gold);opacity:.7}
  .btn{
    display:block;text-decoration:none;color:var(--black);background:var(--white);
    border:1.5px solid var(--black);border-radius:16px;padding:16px 14px;margin:11px 0;
    font-weight:700;font-size:17px;line-height:1.35;
    box-shadow:0 3px 0 rgba(0,0,0,.85);transition:transform .12s,box-shadow .12s;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 0 0 rgba(0,0,0,.85)}
  .btn.hl{background:var(--black);color:var(--white);box-shadow:0 3px 0 var(--gold)}
  .btn small{display:block;font-weight:500;font-size:13px;opacity:.75;margin-top:2px}
  footer{margin-top:34px;font-size:13px;font-weight:500;opacity:.7}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<main>
  <img class="logo" src="logo.png" alt="Shir's Boutique קונדיטוריה בוטיק">
  <p class="tagline">מושב מזור | כשר למהדרין, חלבי</p>
  <div id="links"></div>
  <section class="group" id="group">
    <h2>קבוצת העדכונים השקטה שלנו</h2>
    <p>רק אנחנו מפרסמים, בלי הודעות מיותרות.<br>כאן שומעים ראשונים על מבצעים ומועדי הזמנה.</p>
    <a class="btn" id="group-btn" href="#">להצטרפות לקבוצה</a>
  </section>
  <footer>Shir's Boutique</footer>
</main>

<script>
  // הקישורים בדף. כדי להוסיף/להסתיר כפתור משנים רק כאן.
  // until = מהרגע הזה הכפתור נעלם מעצמו (שעון ישראל). כפתור בלי url לא מוצג.
  var WA = "https://wa.me/972524100148?text=";
  var SECTIONS = [
    { title: "חנוכה", links: [
      { text: "סדנאות סופגניות לחנוכה", url: "https://shirsbou-prog.github.io/hanukkah/", hl: true, until: "2026-12-01T00:00:00+02:00" },
      { text: "הזמנת סופגניות לחנוכה", sub: "ללקוחות פרטיים", url: "https://shirsbou-prog.github.io/sinabon-order/", until: "2026-12-01T00:00:00+02:00" },
      { text: "סופגניות בכמויות ודוכני סופגניות", url: WA + encodeURIComponent("היי שיר, אשמח לפרטים על הזמנת סופגניות בכמויות / דוכן סופגניות לחנוכה 🎁"), until: "2026-12-01T00:00:00+02:00" }
    ]},
    { title: "כל השנה", links: [
      { text: "הזמנה מראש לנקודת איסוף בדוכן בשישי", url: "https://shirsbou-prog.github.io/sinabon-order/" },
      { text: "יצירת קשר", sub: "וואטסאפ", url: WA + encodeURIComponent("היי שיר, הגעתי מהאינסטגרם ואשמח לפרטים 🌸") }
    ]}
  ];

  var GROUP_URL = ""; // קישור לקבוצת הוואטסאפ. כל עוד ריק, החלונית מוסתרת
  var BG_UNTIL ="2026-12-13T00:00:00+02:00"; // אחרי חנוכה חוזרים לרקע הוורוד הרגיל

  var now = new Date(), box = document.getElementById("links");
  if (now < new Date(BG_UNTIL)) document.body.classList.add("holiday");
  if (GROUP_URL) { document.getElementById("group-btn").href = GROUP_URL; document.getElementById("group").classList.add("on"); }
  SECTIONS.forEach(function (s) {
    var live = s.links.filter(function (l) { return l.url && (!l.until || now < new Date(l.until)); });
    if (!live.length) return;
    var h = document.createElement("div"); h.className = "sec"; h.textContent = s.title; box.appendChild(h);
    live.forEach(function (l) {
      var a = document.createElement("a");
      a.className = "btn" + (l.hl ? " hl" : "");
      a.href = l.url; a.textContent = l.text;
      if (l.sub) { var sm = document.createElement("small"); sm.textContent = l.sub; a.appendChild(sm); }
      box.appendChild(a);
    });
  });
</script>
</body>
</html>
